[package]
name = "imagoro-command-center"
version = "0.1.0"
description = "Imagoro Command Center — React-first block GUI + node canvas desktop shell (Tauri v2)"
authors = ["Scout hazard system"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "imagoro_command_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
